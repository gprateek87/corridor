<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Corridor — UAE, India and world news that matters, in sixty words.">
<meta name="theme-color" content="#0B1A26">
<title>Corridor — India · Gulf · World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CORRIDOR — palette of the Arabian Sea corridor.
   Unchanged from v1: night water, saffron (India), pearl-teal
   (Gulf), coral (escalation).
   ============================================================ */
:root{
  --sea-900:#0B1A26; --sea-800:#102532; --sea-700:#17313F; --sea-600:#224354;
  --pearl:#EDE7DC; --pearl-dim:#93A6AF;
  --saffron:#E9A13B; --teal:#39A7A0; --coral:#E2574B;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --chrome:118px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--sea-900);color:var(--pearl);font-family:var(--body);
  -webkit-font-smoothing:antialiased;overflow:hidden}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;border-radius:2px}

/* ---------------- masthead ---------------- */
.chrome{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--sea-900);
  border-bottom:1px solid var(--sea-600)}
.masthead{display:flex;align-items:center;gap:12px;padding:12px 16px 10px}
.wordmark{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.045em;
  line-height:1;text-transform:uppercase}
.wordmark .o{color:var(--saffron)}
.rule{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.rule .end{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--pearl-dim)}
.rule .line{flex:1;height:1px;background:linear-gradient(90deg,var(--saffron),var(--teal));opacity:.55}
.status{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;
  letter-spacing:.1em;color:var(--pearl-dim);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:0 0 auto}
.live .dot{animation:pulse 2.4s infinite}
.dot.warn{background:var(--saffron);animation:none}
.dot.err{background:var(--coral);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.modebtn{background:transparent;border:1px solid var(--sea-600);color:var(--pearl-dim);
  font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:4px;cursor:pointer;line-height:1.2}
.modebtn:hover{border-color:var(--pearl-dim);color:var(--pearl)}

/* ---------------- fx ticker ---------------- */
.ticker{height:26px;overflow:hidden;border-top:1px solid var(--sea-600);
  border-bottom:1px solid var(--sea-600);background:var(--sea-800)}
.tape{display:flex;gap:26px;white-space:nowrap;padding:0 16px;align-items:center;height:100%;
  font-family:var(--mono);font-size:10.5px;animation:slide 48s linear infinite;will-change:transform}
.tape:hover{animation-play-state:paused}
.fx b{font-weight:500;color:var(--pearl-dim);letter-spacing:.08em;margin-right:7px}
.up{color:var(--teal)} .down{color:var(--coral)}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------------- filters ---------------- */
.chips{display:flex;gap:6px;padding:9px 16px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:transparent;border:1px solid var(--sea-600);color:var(--pearl-dim);
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;cursor:pointer;transition:.16s}
.chip:hover{border-color:var(--pearl-dim);color:var(--pearl)}
.chip[aria-pressed="true"]{background:var(--pearl);border-color:var(--pearl);color:var(--sea-900);font-weight:500}

/* ---------------- diagnostics ---------------- */
.diag{display:none;padding:12px 16px;border-top:1px solid var(--sea-600);background:var(--sea-800);
  font-family:var(--mono);font-size:10px;line-height:1.75;color:var(--pearl-dim);
  max-height:38vh;overflow-y:auto}
.diag.open{display:block}
.diag b{color:var(--pearl);font-weight:500}
.diag .ok{color:var(--teal)} .diag .bad{color:var(--coral)}

/* ---------------- feed ---------------- */
.feed{position:fixed;top:var(--chrome);bottom:0;left:0;right:0;overflow-y:auto;
  scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;
  overscroll-behavior-y:contain}
.card{scroll-snap-align:start;scroll-snap-stop:always;min-height:calc(100dvh - var(--chrome));
  display:flex;flex-direction:column;border-bottom:1px solid var(--sea-600);background:var(--sea-900);
  content-visibility:auto;contain-intrinsic-size:600px}

.body-wrap{display:flex;flex:1;min-height:0}
.spine{flex:0 0 34px;display:flex;flex-direction:column;align-items:center;padding:20px 0 18px;gap:8px}
.spine .tick{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--pearl-dim)}
.bar{flex:1;width:3px;border-radius:2px;background:var(--sea-700);display:flex;flex-direction:column;
  overflow:hidden;min-height:60px}
.bar .in{background:var(--saffron)} .bar .ae{background:var(--teal)}
.bar .rest{background:var(--sea-700);flex:1}
.spine .flare{width:9px;height:9px;border-radius:50%;background:var(--coral);opacity:0}
.spine .flare.on{opacity:1;box-shadow:0 0 0 4px rgba(226,87,75,.18)}

/* fixed aspect box prevents layout shift while the image loads */
.art{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--sea-800);flex:0 0 auto}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .glaze{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,26,38,.9),transparent 55%);
  pointer-events:none}
.art .tag{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:9px;
  letter-spacing:.13em;text-transform:uppercase;padding:3px 8px;border-radius:3px;
  background:rgba(11,26,38,.82);border:1px solid var(--sea-600)}

/* --- local fallback artwork: the woven tile, tinted per category --- */
.art.blank{background:repeating-linear-gradient(135deg,var(--sea-800) 0 11px,var(--sea-700) 11px 22px)}
.art.blank::after{content:"";position:absolute;inset:0;opacity:.30;
  background:radial-gradient(120% 90% at 22% 12%,var(--tint,transparent),transparent 62%)}
.art.blank .src{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.02em;
  color:var(--pearl);opacity:.62;text-align:center;padding:0 20px;z-index:1}
.c-uae{--tint:var(--teal)}       .c-gcc{--tint:#4E86A0}
.c-india{--tint:var(--saffron)}  .c-corridor{--tint:#C98A4B}
.c-world{--tint:#5A7C8C}         .c-business{--tint:#3F8F86}
.c-credit{--tint:var(--coral)}   .c-entertainment{--tint:#B0619B}
.c-sports{--tint:#6FA35B}        .c-tech{--tint:#6C7FC0}

.tag.c-uae,.tag.c-business{color:var(--teal)}
.tag.c-india,.tag.c-corridor{color:var(--saffron)}
.tag.c-credit{color:var(--coral)}
.tag.c-entertainment{color:#D08FC0}
.tag.c-sports{color:#8FC47A}
.tag.c-tech{color:#93A3DA}
.tag.c-world,.tag.c-gcc{color:var(--pearl-dim)}

.text{padding:18px 20px 20px 4px;display:flex;flex-direction:column;gap:11px;flex:1}
h2{font-family:var(--display);font-weight:600;font-size:clamp(20px,5.4vw,25px);line-height:1.14;
  letter-spacing:-.028em}
h2 a{color:inherit;text-decoration:none}
h2 a:hover{text-decoration:underline;text-decoration-color:var(--saffron);text-underline-offset:3px}
.gist{font-size:15px;line-height:1.56;color:#C6CFD4;flex:1}
.nogist{color:var(--pearl-dim);font-style:italic;font-size:13.5px}
.meta{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--pearl-dim);padding-top:3px;
  border-top:1px solid var(--sea-600)}
.meta .sep{width:3px;height:3px;border-radius:50%;background:var(--sea-600);flex:0 0 auto}
.meta a{margin-left:auto;color:var(--saffron);text-decoration:none;white-space:nowrap}
.meta a:hover{text-decoration:underline}

/* ---------------- states ---------------- */
.state{padding:56px 24px;text-align:center;color:var(--pearl-dim);max-width:420px;margin:0 auto}
.state h3{font-family:var(--display);font-weight:600;font-size:19px;color:var(--pearl);
  margin-bottom:8px;letter-spacing:-.02em}
.state p{font-size:14px;line-height:1.6}
.state button{margin:16px 5px 0;background:transparent;border:1px solid var(--sea-600);color:var(--pearl);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:8px 15px;border-radius:999px;cursor:pointer}
.state button:hover{border-color:var(--saffron);color:var(--saffron)}
.loader{display:flex;gap:5px;justify-content:center;padding:70px 0}
.loader i{width:4px;height:22px;background:var(--sea-600);border-radius:2px;animation:wave 1.1s infinite ease-in-out}
.loader i:nth-child(2){animation-delay:.1s}.loader i:nth-child(3){animation-delay:.2s}
.loader i:nth-child(4){animation-delay:.3s}.loader i:nth-child(5){animation-delay:.4s}
@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1);background:var(--teal)}}

/* ---------------- desktop ---------------- */
@media(min-width:820px){
  :root{--chrome:132px}
  .masthead{padding:16px 32px 12px;gap:20px}
  .wordmark{font-size:23px}
  .chips{padding:11px 32px}
  .diag{padding:12px 32px}
  .feed{scroll-snap-type:none;padding:26px 32px 60px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;align-items:start;
    max-width:1500px;margin:0 auto}
  .card{min-height:0;border:1px solid var(--sea-600);border-radius:6px;overflow:hidden;
    background:var(--sea-800);transition:border-color .18s,transform .18s}
  .card:hover{border-color:var(--sea-700);transform:translateY(-2px)}
  .card:hover .meta .stamp{opacity:1}
  .meta .stamp{opacity:0;transition:.18s}
  .text{padding:16px 18px 16px 4px}
  h2{font-size:19px}
  .gist{font-size:13.5px;line-height:1.55}
  .spine{flex:0 0 30px;padding:16px 0 14px}
}
@media(min-width:1180px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1560px){.grid{grid-template-columns:repeat(4,1fr)}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .feed{scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="chrome">
  <div class="masthead">
    <div class="wordmark">C<span class="o">o</span>rridor</div>
    <div class="rule"><span class="end">IN</span><span class="line"></span><span class="end">AE</span></div>
    <div class="status live" id="status"><span class="dot"></span><span id="statusText">Loading</span></div>
    <button class="modebtn" id="modeBtn" aria-expanded="false" title="Source diagnostics">···</button>
  </div>
  <div class="ticker"><div class="tape" id="tape"></div></div>
  <nav class="chips" id="chips" aria-label="Filter stories"></nav>
  <div class="diag" id="diag"></div>
</header>

<main class="feed" id="feed">
  <div class="grid" id="grid">
    <div class="loader" aria-label="Loading stories"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</main>

<script>
'use strict';

const CATS = [
  ['all','For You'], ['uae','UAE'], ['gcc','GCC'], ['india','India'],
  ['corridor','India–Gulf'], ['world','World'], ['business','Business'],
  ['credit','Credit'], ['entertainment','Entertainment'], ['sports','Sports'], ['tech','Tech']
];
const LABEL = Object.fromEntries(CATS);
const NEWS_URL = '/api/news';
const FETCH_TIMEOUT = 8000;
const REFRESH_MS = 15 * 60 * 1000;
const CACHE_KEY = 'corridor.stories.v2';
const FX_KEY = 'corridor.fx.v2';

let stories = [], filter = 'all', diagnostics = [], updatedAt = null;

/* ---------- safe local storage (fails silently in sandboxed frames) ---------- */
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ---------- escaping: everything from a publisher is untrusted ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ago = iso => {
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 6e4);
  if (!isFinite(m) || m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60);
  return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
};

/* ---------- status ---------- */
const statusEl = document.getElementById('statusText');
const statusBox = document.getElementById('status');
function setStatus(text, level){
  statusEl.textContent = text;
  const dot = statusBox.querySelector('.dot');
  statusBox.classList.toggle('live', level !== 'err' && level !== 'warn');
  dot.classList.toggle('warn', level === 'warn');
  dot.classList.toggle('err', level === 'err');
}

/* ---------- rendering ---------- */
const grid = document.getElementById('grid');

function cardHTML(s, index){
  const total = Math.max(s.indiaImpact + s.gulfImpact, 1);
  const inPct = s.indiaImpact ? Math.round(s.indiaImpact / total * 100) : 0;
  const aePct = s.gulfImpact ? Math.round(s.gulfImpact / total * 100) : 0;
  const fill = Math.min(100, (s.indiaImpact + s.gulfImpact) * 22);
  const cls = 'c-' + s.category;
  const url = esc(s.url);

  const art = s.image
    ? `<img src="${esc(s.image)}" alt="" ${index === 0
        ? 'loading="eager" fetchpriority="high"' : 'loading="lazy" fetchpriority="low"'}
        decoding="async" referrerpolicy="no-referrer" data-fallback="1">`
    : `<span class="src">${esc(s.source)}</span>`;

  return `<article class="card">
    <div class="art ${cls}${s.image ? '' : ' blank'}">
      ${art}<div class="glaze"></div>
      <span class="tag ${cls}">${esc(LABEL[s.category] || s.category)}</span>
    </div>
    <div class="body-wrap">
      <div class="spine" title="India ${inPct}% · Gulf ${aePct}%">
        <span class="flare${s.escalation >= 2 ? ' on' : ''}"></span>
        <div class="bar">
          <div class="in" style="height:${fill * inPct / 100}%"></div>
          <div class="ae" style="height:${fill * aePct / 100}%"></div>
          <div class="rest"></div>
        </div>
        <span class="tick">${inPct >= aePct ? 'IN' : 'AE'}</span>
      </div>
      <div class="text">
        <h2><a href="${url}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a></h2>
        <p class="gist">${s.summary
          ? esc(s.summary)
          : '<span class="nogist">No summary in this feed — open the story to read it.</span>'}</p>
        <div class="meta">
          <span>${esc(s.source)}</span><span class="sep"></span>
          <span class="stamp">${ago(s.publishedAt)}</span>
          <a href="${url}" target="_blank" rel="noopener noreferrer">Read source →</a>
        </div>
      </div>
    </div>
  </article>`;
}

function render(){
  const list = filter === 'all' ? stories : stories.filter(s => s.category === filter);
  if (!list.length){
    grid.innerHTML = `<div class="state" style="grid-column:1/-1">
      <h3>Nothing in ${esc(LABEL[filter] || filter)} right now</h3>
      <p>No stories matched this filter in the current edition. Try another lane.</p>
      <button data-act="showall">Show For You</button></div>`;
    return;
  }
  grid.innerHTML = list.map(cardHTML).join('');
}

function chips(){
  document.getElementById('chips').innerHTML = CATS.map(([k,l]) =>
    `<button class="chip" aria-pressed="${filter === k}" data-k="${k}">${l}</button>`).join('');
}

/* event delegation — one listener each, no per-card handlers */
document.getElementById('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  filter = b.dataset.k;
  chips(); render();
  document.getElementById('feed').scrollTo({ top: 0 });
});

grid.addEventListener('click', e => {
  if (e.target.closest('[data-act="showall"]')){
    filter = 'all'; chips(); render();
  }
});

/* broken publisher images fall back to the woven tile */
grid.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName !== 'IMG' || !img.dataset.fallback) return;
  const art = img.parentElement;
  art.classList.add('blank');
  const src = document.createElement('span');
  src.className = 'src';
  src.textContent = img.closest('.card')?.querySelector('.meta span')?.textContent || 'Corridor';
  art.insertBefore(src, art.firstChild);
  img.remove();
}, true);

/* ---------- news loading: cache first, network second ---------- */
function applyPayload(data, fromCache){
  stories = data.stories;
  diagnostics = data.diagnostics || [];
  updatedAt = data.updatedAt;
  render();
  const time = new Date(updatedAt).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  if (fromCache) setStatus('Using saved edition', 'warn');
  else setStatus(`Live · ${stories.length} stories · ${time}`);
  paintDiag();
}

async function fetchNews(){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), FETCH_TIMEOUT);
  try {
    const r = await fetch(NEWS_URL, { signal: ctl.signal, headers: { 'Accept':'application/json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (!data || !Array.isArray(data.stories) || !data.stories.length) throw new Error('empty payload');
    return data;
  } finally {
    clearTimeout(timer);
  }
}

async function load({ initial } = {}){
  const cached = initial ? store.get(CACHE_KEY) : null;
  if (cached?.stories?.length){
    applyPayload(cached, true);          // paint instantly from the saved edition
    setStatus('Refreshing');
  } else if (initial){
    setStatus('Loading');
  } else {
    setStatus('Refreshing');
  }

  try {
    const data = await fetchNews();
    applyPayload(data, false);
    store.set(CACHE_KEY, data);
  } catch (err){
    if (stories.length){
      setStatus('Using saved edition', 'warn');
    } else {
      setStatus('Unable to refresh', 'err');
      grid.innerHTML = `<div class="state" style="grid-column:1/-1">
        <h3>Couldn't load the edition</h3>
        <p>The news service didn't respond. This is usually temporary.</p>
        <button data-act="retry">Try again</button>
        <button data-act="diag">What failed?</button></div>`;
    }
  }
}

grid.addEventListener('click', e => {
  if (e.target.closest('[data-act="retry"]')) load({ initial:false });
  if (e.target.closest('[data-act="diag"]')) document.getElementById('modeBtn').click();
});

/* ---------- diagnostics drawer ---------- */
const diag = document.getElementById('diag');
function paintDiag(){
  if (!diag.classList.contains('open')) return;
  const when = updatedAt ? new Date(updatedAt).toLocaleString() : 'never';
  const lines = diagnostics.length
    ? diagnostics.map(d => `<span class="${d.success ? 'ok' : 'bad'}">${d.success ? '✓' : '✕'}</span> `
        + `${esc(d.source)} · ${d.success ? d.count + ' stories' : esc(d.error || 'failed')}`).join('<br>')
    : 'No diagnostics available.';
  diag.innerHTML = `<b>Edition:</b> ${esc(when)} &nbsp;·&nbsp; <b>${stories.length}</b> stories shown`
    + ` <button class="modebtn" data-act="copy" style="margin-left:6px">Copy report</button><br><br>${lines}`;
}
document.getElementById('modeBtn').addEventListener('click', () => {
  const open = diag.classList.toggle('open');
  document.getElementById('modeBtn').setAttribute('aria-expanded', String(open));
  paintDiag();
});
diag.addEventListener('click', e => {
  if (!e.target.closest('[data-act="copy"]')) return;
  const report = `Corridor report — ${stories.length} stories, edition ${updatedAt}\n`
    + diagnostics.map(d => `${d.success ? 'OK  ' : 'FAIL'} ${d.source} · ${d.method} · ${d.success ? d.count : d.error}`).join('\n');
  navigator.clipboard?.writeText(report).then(() => {
    e.target.textContent = 'Copied';
    setTimeout(() => { e.target.textContent = 'Copy report'; }, 1600);
  }, () => { e.target.textContent = 'Copy failed'; });
});

/* ---------- FX ticker: fully independent of the news feed ---------- */
const tape = document.getElementById('tape');
function paintFx(rows, stale){
  const cached = store.get(FX_KEY)?.rows || {};
  const cells = rows.map(([k,v]) => {
    const p = cached[k];
    const dir = p == null ? '' : (v > p ? 'up' : v < p ? 'down' : '');
    const arrow = dir === 'up' ? ' ▲' : dir === 'down' ? ' ▼' : '';
    return `<span class="fx"><b>${k}</b><span class="${dir}">${v.toFixed(v > 50 ? 2 : 4)}${arrow}</span></span>`;
  }).join('') + (stale ? '<span class="fx"><b>·</b><span>last known rates</span></span>' : '');
  tape.innerHTML = cells + cells;   // doubled for a seamless loop
}

async function fx(){
  const prev = store.get(FX_KEY);
  if (prev?.rows) paintFx(Object.entries(prev.rows), true);   // show something immediately

  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch('https://open.er-api.com/v6/latest/USD', { signal: ctl.signal });
    clearTimeout(timer);
    const d = await r.json();
    if (!d?.rates) throw new Error('no rates');
    const R = d.rates;
    const rows = [
      ['USD/INR', R.INR], ['AED/INR', R.INR / R.AED], ['USD/AED', R.AED],
      ['EUR/INR', R.INR / R.EUR], ['GBP/INR', R.INR / R.GBP],
      ['SAR/INR', R.INR / R.SAR], ['USD/JPY', R.JPY], ['USD/CNY', R.CNY]
    ].filter(([,v]) => typeof v === 'number' && isFinite(v));
    paintFx(rows, false);
    store.set(FX_KEY, { rows: Object.fromEntries(rows), at: Date.now() });
  } catch {
    if (!prev?.rows) tape.innerHTML = '<span class="fx"><b>FX</b><span>rates unavailable</span></span>';
  }
}

/* ---------- boot ---------- */
chips();
load({ initial: true });
fx();                                   // deliberately not awaited
setInterval(() => load({ initial:false }), REFRESH_MS);
setInterval(fx, REFRESH_MS);
setInterval(() => {
  const list = filter === 'all' ? stories : stories.filter(s => s.category === filter);
  document.querySelectorAll('.stamp').forEach((el, i) => {
    if (list[i]) el.textContent = ago(list[i].publishedAt);
  });
}, 60000);
</script>
</body>
</html>
